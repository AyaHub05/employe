name: Java CI with Maven
on:
  push:
    branches: main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Vérification du code source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build & Test
        run: mvn clean verify  -DskipTests sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/employedb
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root